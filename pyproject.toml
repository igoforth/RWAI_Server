[project]
name = "AIServer"
version = "0.2.2"
description = "Supporting python scripts for RWAI backend"
authors = [
    {name = "Ian Goforth", email = "ian.goforth@gmail.com"},
]
dependencies = [
    "OpenAI-Python-Client>=0.2.3",
    "babel>=2.15.0",
    "protobuf>=5.27.0",
    "polib>=1.2.0",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "AIServer"
